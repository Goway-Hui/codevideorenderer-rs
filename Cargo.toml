[package]
name = "codevideorenderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Render dynamic \"typing\" code videos — a Rust reimplementation of CodeVideoRenderer"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/codevideorenderer"
keywords = ["video", "code", "animation", "render", "syntax-highlighting"]
categories = ["multimedia::video", "command-line-utilities"]
# 本目录不是 git 仓库，cargo 不会读 .gitignore，所以要显式排除这些文件；
# 否则演示产物（几个 MP4）会把发布包从 7 MiB 撑到 22 MiB，超过 crates.io 的上限。
exclude = [
    "*.mp4",
    "frame_*.png",
    "preview.png",
    "frames/",
    "CodeVideoRenderer-rs-TODO.md",
    "docs/",
]

[lib]
name = "codevideorenderer"
path = "src/lib.rs"

[[bin]]
name = "cvr"
path = "src/main.rs"

[dependencies]
rayon = "1.12.0"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"

[features]
default = []
# Bake assets/CodeVideoRendererFont.ttf into the binary (needs the file at build time).
embed-font = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
